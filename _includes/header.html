{%- comment -%} Modern top header — overrides Prologue sidebar {%- endcomment -%}
<div id="header">
  <div class="top">
    <div id="logo">
      <a href="{{ '/' | relative_url }}" style="display:flex;align-items:center;gap:12px;border:none;text-decoration:none;">
        <span class="image avatar48">GS</span>
        <span>
          <h1 id="title" style="margin:0;">{{ site.title }}</h1>
          <p style="margin:0;">Portfolio • Chennai, India</p>
        </span>
      </a>
    </div>
    <nav id="nav">
      <ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}><span>Home</span></a></li>
        <li><a href="{{ '/backend' | relative_url }}" {% if page.url contains 'backend' %}class="active"{% endif %}><span>Backend</span></a></li>
        <li><a href="{{ '/ai' | relative_url }}" {% if page.url contains '/ai' %}class="active"{% endif %}><span>AI</span></a></li>
        <li><a href="{{ '/#projects' | relative_url }}"><span>Projects</span></a></li>
        <li><a href="{{ '/#experience' | relative_url }}"><span>Experience</span></a></li>
      </ul>
    </nav>
  </div>
  <div class="bottom" style="display:flex;gap:12px;align-items:center;">
    {%- include social_icons.html -%}
    <a href="mailto:{{ site.email }}" class="btn btn-dark" style="padding:8px 14px;font-size:12px;">Resume</a>
  </div>
</div>
