{%- comment -%} Modern top header — overrides Prologue sidebar {%- endcomment -%}
<div id="header">
  <div class="top">
    <div id="logo">
      <a href="{{ '/' | relative_url }}" style="display:flex;align-items:center;gap:12px;border:none;text-decoration:none;">
        <span class="image avatar48">GS</span>
        <span>
          <h1 id="title" style="margin:0;">{{ site.title }}</h1>
          <p style="margin:0;">Portfolio • Chennai, India</p>
        </span>
      </a>
    </div>
    <nav id="nav">
      <ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}><span>Home</span></a></li>
        <li><a href="{{ '/backend' | relative_url }}" {% if page.url contains 'backend' %}class="active"{% endif %}><span>Backend</span></a></li>
        <li><a href="{{ '/ai' | relative_url }}" {% if page.url contains '/ai' %}class="active"{% endif %}><span>AI</span></a></li>
        <li><a href="{{ '/#projects' | relative_url }}"><span>Projects</span></a></li>
        <li><a href="{{ '/#experience' | relative_url }}"><span>Experience</span></a></li>
      </ul>
    </nav>
  </div>
  <div class="bottom" style="display:flex;gap:12px;align-items:center;">
    {%- include social_icons.html -%}
    <div style="position:relative;">
      <a href="#" class="btn btn-dark" style="padding:8px 14px;font-size:12px;" onclick="document.getElementById('resume-drop').classList.toggle('show'); return false;">Resume ▾</a>
      <div id="resume-drop" style="display:none;position:absolute;right:0;top:34px;background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.08);min-width:180px;z-index:200;overflow:hidden;">
        <a href="{{ 'assets/resume/Gajendra_Saraswat_Backend_OnePager.pdf' | relative_url }}" target="_blank" style="display:block;padding:10px 14px;font-size:12px;color:var(--text-1);text-decoration:none;border-bottom:1px solid var(--border);">Backend PDF</a>
        <a href="{{ 'assets/resume/Gajendra_Saraswat_AI_OnePager.pdf' | relative_url }}" target="_blank" style="display:block;padding:10px 14px;font-size:12px;color:var(--text-1);text-decoration:none;">AI PDF</a>
      </div>
    </div>
    <script>document.addEventListener('click',function(e){var d=document.getElementById('resume-drop'); if(d && !e.target.closest('#resume-drop') && !e.target.closest('a.btn-dark')) d.classList.remove('show');});</script>
    <style>#resume-drop.show{display:block !important;}</style>
  </div>
</div>
